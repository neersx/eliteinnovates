# Install as /etc/nginx/conf.d/eliteinnovates.com.conf (inside nginx's http block).
# Angular SSR only; this application has no .NET upstream or /secure-service.
# Keep port 4300 and the web directory in sync with elite-innovates.service
# and deploy-script.sh. Requires the TLS files described in README.md.
# Compatible with the nginx 1.18 listen/http2 syntax used on the shared VPS.

upstream elite_innovates_ssr {
    server 127.0.0.1:4300;
    keepalive 16;
}

# Canonical origin matches the application's existing https://eliteinnovates.com URLs.
server {
    listen 80;
    listen [::]:80;
    server_name eliteinnovates.com www.eliteinnovates.com;
    return 301 https://eliteinnovates.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eliteinnovates.com;

    ssl_certificate     /var/www/elite-innovates/ssl/eliteinnovates_com.fullchain.pem;
    ssl_certificate_key /var/www/elite-innovates/ssl/eliteinnovates_com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://eliteinnovates.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eliteinnovates.com;

    ssl_certificate     /var/www/elite-innovates/ssl/eliteinnovates_com.fullchain.pem;
    ssl_certificate_key /var/www/elite-innovates/ssl/eliteinnovates_com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/elite-innovates/web/browser;
    access_log /var/log/nginx/eliteinnovates.access.log;
    error_log /var/log/nginx/eliteinnovates.error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    client_max_body_size 1m;

    # Only content-hashed build bundles get immutable caching.
    # Quoting is required because the regex contains a {8,} quantifier.
    location ~* "^/[^/]+-[a-z0-9_-]{8,}\.(?:js|css|woff2?|ttf)$" {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Logos and other stable filenames may change without being renamed.
    location /assets/ {
        access_log off;
        expires 1h;
        try_files $uri =404;
    }

    location ~* \.(?:js|mjs|css|woff2?|ttf|png|jpe?g|gif|svg|webp|avif|ico|txt|xml|json|webmanifest)$ {
        access_log off;
        expires 1h;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # All page routes go to Node, including /services, /portfolio and /jobs/:slug.
    # Do not add a /index.html SPA fallback: it would bypass server rendering.
    location / {
        proxy_pass http://elite_innovates_ssr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # This nginx is the public edge; replace client-supplied forwarding data.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
}
